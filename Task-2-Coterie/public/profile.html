<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile · Coterie</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div data-header></div>

  <main class="container reading-width">
    <div class="panel profile-header" id="profile-header"></div>
    <div id="feed"></div>
  </main>

  <dialog id="editor">
    <form method="dialog">
      <h2>Edit profile</h2>
      <label for="edit-name">Display name</label>
      <input id="edit-name" name="displayName" maxlength="80" required />

      <label for="edit-bio">Bio</label>
      <textarea id="edit-bio" name="bio" rows="3" maxlength="300"></textarea>

      <div class="dialog-actions">
        <button class="btn ghost" type="submit" value="cancel">Cancel</button>
        <button class="btn" type="submit" value="save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="people">
    <h2 data-people-title>Followers</h2>
    <div class="people-list" data-people-list></div>
    <form method="dialog" class="dialog-actions">
      <button class="btn ghost" type="submit">Close</button>
    </form>
  </dialog>

  <script src="/js/api.js"></script>
  <script src="/js/html.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/comment-thread.js"></script>
  <script src="/js/post-card.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
