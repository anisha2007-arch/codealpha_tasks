<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Coterie</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body>
  <div data-header></div>

  <main class="container narrow">
    <div class="panel">
      <h1 id="title">Sign in</h1>
      <div id="alert"></div>

      <form id="form">
        <div id="register-fields" hidden>
          <label for="handle">Handle</label>
          <input id="handle" name="handle" pattern="[a-z0-9_]{3,20}"
                 placeholder="lowercase, 3 to 20 characters" />

          <label for="displayName">Display name</label>
          <input id="displayName" name="displayName" maxlength="80" />
        </div>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" minlength="8"
               autocomplete="current-password" required />

        <button class="btn block" type="submit" id="submit">Sign in</button>
      </form>

      <p class="switch-row">
        <span id="switch-text">New here?</span>
        <a href="#" id="switch">Create an account</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/html.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
