<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sightline</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/board.css" />
  <link rel="stylesheet" href="/css/notifications.css" />
</head>
<body>
  <div data-header></div>

  <main class="page two-column">
    <div>
      <h1 class="page-title">Projects</h1>
      <div id="projects"></div>
    </div>

    <aside>
      <form class="panel" id="new-project">
        <h2>New project</h2>
        <label for="p-name">Name</label>
        <input id="p-name" name="name" maxlength="80" required />

        <label for="p-desc">Description</label>
        <textarea id="p-desc" name="description" rows="3" maxlength="300"></textarea>

        <button class="btn block" type="submit">Create project</button>
      </form>
    </aside>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/html.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/notifications.js"></script>
  <script src="/js/projects.js"></script>
</body>
</html>
