<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marginalia · Catalogue</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>
  <div data-header></div>

  <section class="banner">
    <div class="container">
      <h1>Marginalia</h1>
      <p>A small bookshop. Everything on these shelves was picked by hand.</p>
    </div>
  </section>

  <main class="container">
    <div class="toolbar">
      <div class="chips" id="genres"></div>
      <input type="search" id="search" placeholder="Search titles and authors" aria-label="Search books" />
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/cart-store.js"></script>
  <script src="/js/html.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/catalogue.js"></script>
</body>
</html>
