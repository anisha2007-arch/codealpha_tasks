<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in · Marginalia</title>
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/shop.css" />
</head>
<body>
  <div data-header></div>

  <main class="container narrow">
    <div class="panel">
      <h1 id="title">Sign in</h1>
      <div id="alert"></div>

      <form id="form">
        <div id="name-field" hidden>
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" />
        </div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" required />

        <button class="btn block" type="submit" id="submit">Sign in</button>
      </form>

      <p class="switch-row">
        <span id="switch-text">New to Marginalia?</span>
        <a href="#" id="switch">Create an account</a>
      </p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/cart-store.js"></script>
  <script src="/js/html.js"></script>
  <script src="/js/format.js"></script>
  <script src="/js/chrome.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
